name: Strict AI Guardrail CI - Multimodal S2S Pipeline

# Tự động kích hoạt khi có commit mới hoặc mở PR vào các nhánh chính
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  code-verification:
    name: Verify Code Integrity & Test Suite
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn về máy ảo CI
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Khởi tạo môi trường Python 3.10
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Cài đặt hệ thống C audio libraries (FFmpeg, eSpeak-ng, libsndfile1)
      - name: Install System Audio Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1

      # 4. Cài đặt dependencies Python
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install flake8 mypy

      # 5. Step 1: Kiểm tra cú pháp tĩnh toàn bộ file (.py)
      - name: Step 1 - Syntax & Static Compile Check
        run: |
          python -c "import compileall; assert compileall.compile_dir('src', force=True), 'Compilation failed in src/'"
          python -c "import compileall; assert compileall.compile_dir('scripts', force=True), 'Compilation failed in scripts/'"
          python -c "import compileall; assert compileall.compile_dir('tests', force=True), 'Compilation failed in tests/'"

      # 6. Step 2: Soi chuẩn code & lọc code bẩn bằng flake8
      - name: Step 2 - Linting Check (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # 7. Step 3: Chạy bộ kiểm thử tự động 4 phân tầng (Tier 1 -> Tier 4)
      - name: Step 3 - Run 4-Tier Automated Test Suite
        run: |
          python -m unittest tests/test_tier1_feature.py tests/test_tier2_boundary.py tests/test_tier3_combinations.py tests/test_tier4_scenarios.py
